spring.application.name=suncomputer

server.port=8080

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_FOR_PRODUCTION_123456789}

app.jwt.expiration=${JWT_EXPIRATION:86400000}


# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Password reset
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ltoday435@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nfxr lhhb xyie xkxq}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true