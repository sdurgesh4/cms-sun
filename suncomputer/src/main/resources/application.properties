spring.application.name=suncomputer

server.port=8080

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_FOR_PRODUCTION_123456789}

app.jwt.expiration=${JWT_EXPIRATION:86400000}
